[build-system]
requires = ["setuptools>=61.0", "versioneer[toml]"]
build-backend = "setuptools.build_meta"

[project]
name = "tsg-xr"
authors = [{ name = "Morgan Williams", email = "morgan.williams@csiro.au" }]
description = "A tool for reading TSG spectra data into Xarray."
requires-python = ">=3.9"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy",
  "xarray>=2024.10",
  "zarr",
  "pandas",
  "pytsg>=0.2.8",
  "typer",
]
keywords = ["TSG", "spectra"]
dynamic = ["version", "readme"]
license = { text = "MIT License" }

[tool.setuptools]
packages = ['tsgxr']

[project.urls]
repository = "https://github.com/CSIRO-GeoscienceAnalytics/tsg-xr"
issues = "https://github.com/CSIRO-GeoscienceAnalytics/tsg-xr/issues"

[project.scripts]
tsgxr = "tsgxr.cli:app"


[project.optional-dependencies]
plot = ["matplotlib"]
docs = [
  "sphinx_rtd_theme",
  "docutils",
  "sphinx>=4",
  "sphinx-autodoc-annotation",
  "sphinx_gallery",
  "myst-parser",
  "nbsphinx",
  "ipykernel",                 # for nbsphinx to find a kernel
]
test = ["pytest", "pytest-cov", "coverage"]
dev = ["build", "ruff", "twine", "tsg-xr[plot,test,docs]"]

[tool.setuptools.dynamic]
readme = { file = "README.md", content-type = "text/markdown" }

[tool.versioneer]
VCS = "git"
style = "pep440"
versionfile_source = "tsg-xr/_version.py"
versionfile_build = "tsg-xr/_version.py"
tag_prefix = ""
parentdir_prefix = "tsg-xr-"

[tool.pytest.ini_options]
python_files = "*.py"
addopts = "--cov=tsg-xr --cov-report html --cov-report xml --cov-report term-missing"
testpaths = ["test"]
pythonpath = ["."]


[tool.coverage.run]
# Ignore _version.py
omit = ["test/*", "docs/*", "*/_version.py"]
relative_files = true
source = ["tsg-xr"]
